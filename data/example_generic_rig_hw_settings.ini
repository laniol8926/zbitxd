# Example hw_settings.ini for the generic-rig backend (any hamlib-controlled
# transceiver, e.g. a QMX, via rigctld) instead of zBitx SDR hardware.
#
# To use: copy this file's [generic_rig] section (and radio=generic) into
# your own hw_settings.ini, alongside whatever [tx_band] entries you still
# want (band-power scaling is meaningless for a generic rig that does its
# own PA/ALC, so [tx_band] entries can just be omitted).
#
# Before starting zbitxd, start rigctld against the actual radio, e.g.:
#   rigctld -m <hamlib model number for your rig> -r /dev/ttyACM0 -t 4532
# (confirmed working against a real QMX: rigctl -m 2 -r 127.0.0.1:4532 f)
#
# capture_device/playback_device: "default" may not point at the rig's own
# audio interface -- check `aplay -l`/`arecord -l` for its real card name
# (a QMX shows up as e.g. "card 1: qmxaudio [QMX Transceiver]", i.e.
# plughw:1,0 or plughw:qmxaudio,0) and use that instead of "default".

radio=generic

[generic_rig]
rigctld_host=127.0.0.1
# 4532 is zbitxd's own hamlib.c port (it emulating a rig for other hamlib
# software) -- use a different port here to avoid colliding with that
rigctld_port=4533
capture_device=plughw:qmxaudio,0
playback_device=plughw:qmxaudio,0
